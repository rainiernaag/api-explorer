<!DOCTYPE html>
<html>
<head>
    <title>API Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pokemon API Explorer</h1>

    <div class="mode-toggle">
        <button id="singleModeBtn" class="mode-btn active">Single Search</button>
        <button id="compareModeBtn" class="mode-btn">Compare Mode</button>
    </div>

    <div id="singleSearch">
        <input type="text" id="searchBox" placeholder="Type a Pokemon name...">
        <button id="searchBtn">Search</button>
        <div id="result"></div>
    </div>

    <div id="compareSearch" class="hidden">
        <input type="text" id="searchBox1" placeholder="First Pokemon name...">
        <input type="text" id="searchBox2" placeholder="Second Pokemon name...">
        <button id="compareBtn">Compare</button>
        <div id="compareResult" class="compare-container"></div>
    </div>

    <div id="historySection">
        <h3>Search History</h3>
        <ul id="historyList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
